name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned deliberately. Unpinned, a ruff release retroactively fails every
      # open PR for reasons unrelated to the change under review — 0.16 began
      # formatting Python blocks inside Markdown, which turned two untouched
      # design docs red. Bump this on purpose, in its own commit.
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-22.04
            python: "3.10"
            compiler: gcc
          - os: ubuntu-22.04
            python: "3.11"
            compiler: gcc
          - os: ubuntu-22.04
            python: "3.12"
            compiler: gcc
          - os: ubuntu-22.04
            python: "3.12"
            compiler: clang
          # macOS
          - os: macos-14
            python: "3.10"
          - os: macos-15
            python: "3.12"
          # Windows
          - os: windows-2022
            python: "3.10"
          - os: windows-2022
            python: "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Clang (Linux)
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15
          echo "CC=clang-15" >> $GITHUB_ENV
          echo "CXX=clang++-15" >> $GITHUB_ENV

      - name: Install package
        # matplotlib comes from the notebooks extra; tests/test_notebooks.py
        # executes every notebook so the docs cannot rot, and skips without it.
        run: pip install ".[dev,notebooks]" -v

      - name: Run tests
        run: pytest -v

  ecosystem-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with all optional dependencies
        run: |
          pip install ".[dev,notebooks]" -v
          pip install pandas scikit-learn
          # torch and jax are large; install CPU-only variants
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "jax[cpu]"
      - name: Run all tests
        run: pytest -v

  # The .gz Matrix Market path is compiled in only with MTL5_WITH_ZLIB, which is
  # off by default for portability. Without this lane that code would ship with
  # no coverage — tests/test_io.py::TestGzip skips itself when the flag is off.
  zlib-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Install package with zlib enabled
        run: pip install ".[dev,notebooks]" -v -C cmake.define.MTL5_WITH_ZLIB=ON
      - name: Confirm zlib was actually compiled in
        # From a neutral directory: at the repo root, `python -c` puts cwd on
        # sys.path and imports the source `mtl5/` package, which has no compiled
        # _core. pytest is unaffected because it inserts tests/, not the root.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import mtl5, sys; ok = mtl5.build_info()['zlib']; print('zlib:', ok); sys.exit(0 if ok else 1)"
      - name: Run the I/O tests
        run: pytest tests/test_io.py -v
