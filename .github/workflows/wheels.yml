name: Build wheels

# Triggers:
#   release: published    → a human-cut GitHub Release; publish to PyPI.
#   workflow_dispatch     → manual dry-run; publish to TestPyPI (skip-existing).
#   workflow_call         → invoked by release.yml in the same run as an
#                           automated release; `publish` chooses the index and
#                           `ref` selects the tag to build. This path exists
#                           because a GITHUB_TOKEN-created release does NOT
#                           trigger the `release` event above (anti-recursion),
#                           so the automated pipeline builds+publishes inline.
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: "Publish target when called: none | testpypi | pypi"
        type: string
        default: "none"
      ref:
        description: "Git ref (tag or SHA) to build; defaults to the triggering ref"
        type: string
        default: ""

jobs:
  build-wheels:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # When called by release.yml, build the tag semantic-release just
          # created (which carries the bumped version) rather than the caller's
          # pre-bump SHA. Empty for release/dispatch → checkout's default ref.
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # 64-bit only. cibuildwheel's default "auto" archs still include the
          # 32-bit win32 target on Windows, and this C++20 / nanobind / Highway
          # extension has no 32-bit toolchain or deps, so that target fails the
          # build (observed: cp310-win32 exit code 1). auto64 selects just the
          # native 64-bit arch per platform: AMD64 on Windows, x86_64 on Linux,
          # arm64 on the macos-14/15 runners. (Linux i686 was already dropped
          # from "auto" in cibuildwheel 3.0, so it is not a factor here.)
          CIBW_ARCHS: "auto64"
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_TEST_REQUIRES: pytest numpy scipy
          CIBW_TEST_COMMAND: pytest {project}/tests -v

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish every built wheel + the sdist to PyPI. Runs for a human-cut Release
  # (`release` event) or when release.yml calls this workflow with publish=pypi.
  #
  # Auth: Trusted Publishing (OIDC) — no secrets to store or rotate. This repo
  # lives on github.com, so PyPI's OIDC trusts these runners directly. (The
  # `git@github.sw:` origin is only an SSH-config alias whose HostName is
  # github.com, selecting a specific key — NOT a GitHub Enterprise host.)
  #
  # Two trusted publishers are needed on PyPI, because the OIDC `workflow` claim
  # is the ENTRY workflow:
  #   - workflow=wheels.yml   → the `release` (manual) path
  #   - workflow=release.yml  → the workflow_call (automated) path
  # both with environment=pypi. See docs/pypi-release.md.
  publish-pypi:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.publish == 'pypi'
    environment: pypi  # optional manual-approval gate; configure in repo settings
    permissions:
      id-token: write  # mint the OIDC token PyPI verifies; no password needed
    steps:
      - name: Gather wheels and sdist into dist/
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true  # flatten wheels-*/ and sdist/ into a single dir

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Dry-run lane: publish the same artifacts to TestPyPI. Runs on a manual
  # workflow_dispatch, or when release.yml calls this workflow with
  # publish=testpypi. Uses the TestPyPI trusted publisher (environment=pypi,
  # its own per-index registration). skip-existing lets a re-run at an unchanged
  # version succeed instead of 400-ing on a duplicate. See docs/pypi-release.md §4.
  publish-testpypi:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || inputs.publish == 'testpypi'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Gather wheels and sdist into dist/
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
