name: Build wheels

# One workflow, three triggers — all publishing happens HERE so the OIDC
# `workflow` claim is always `wheels.yml` (a direct, non-reusable workflow),
# which is what PyPI's Trusted Publishing supports and what the existing
# trusted publisher (workflow=wheels.yml, environment=pypi) is registered for.
#
#   push: main         → automated release. The `release` job runs
#                        semantic-release (bump/changelog/commit/tag/push/GitHub
#                        Release); if it cut a release, the build + publish-pypi
#                        jobs run in the SAME run. No cross-workflow trigger, no
#                        token: a GITHUB_TOKEN-created release does not cascade,
#                        so build+publish must live in this run.
#   release: published → a human-cut GitHub Release (e.g. gh release create).
#                        Skips semantic-release; builds + publishes to PyPI.
#   workflow_dispatch  → manual dry-run; builds + publishes to TestPyPI.
#
# NOTE: reusable workflows are deliberately NOT used — PyPI Trusted Publishing
# does not support them (the OIDC claim becomes ambiguous). See
# https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Serialize releases so two pushes cannot race semantic-release.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege at workflow scope: build jobs only read code. The `release`
# job grants itself contents:write (to push the tag/commit), and the publish
# jobs grant themselves id-token:write (OIDC) — see their per-job permissions.
permissions:
  contents: read

jobs:
  # Build and TEST a repaired wheel on every platform BEFORE the version is cut
  # (#81). Nothing here is published or uploaded; the wheels are thrown away.
  # The only product is a pass/fail that `release` depends on.
  #
  # Why this exists: the tag, the release commit and the GitHub Release used to
  # be created before anything was built, so any wheel failure left a tagged,
  # released version with nothing on PyPI — recoverable only by deleting the tag
  # and Release and reverting the release commit. That is not hypothetical; it
  # happened on v5.9.8 (#80).
  #
  # And it is precisely the failure this job can catch, because CIBW_TEST_COMMAND
  # below is the ONLY place a REPAIRED wheel is exercised anywhere in CI.
  # delvewheel (Windows), delocate (macOS) and auditwheel (Linux) each rewrite
  # the wheel and how it resolves its libraries, so a repaired wheel can fail
  # where the in-tree build every PR lane tests succeeds. v5.9.8 died on exactly
  # that: "DLL load failed while importing _core" from a test that loaded the
  # .pyd by path, bypassing the package __init__ where a repaired wheel sets up
  # the DLL search path.
  #
  # Push only. On a human-cut release or a manual dispatch the tag already
  # exists or nothing is being tagged, so there is no window to protect and no
  # reason to pay for the build.
  #
  # Cost is contained by building ONE Python per platform rather than three: the
  # risk being guarded is platform packaging and library repair, which does not
  # vary by interpreter version. That keeps this at 4 builds against the release
  # path's 12.
  #
  # Known limitation: these wheels carry the PRE-bump version, since the bump
  # happens in `release` below. The artifact tested is therefore not
  # byte-identical to the one published — same sources and same repair, one
  # version string apart. Closing that gap needs the version computed before the
  # build (option 2 in #81), which is a larger change.
  validate-wheels:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        # Pinned. cibuildwheel builds, repairs and TESTS every wheel published
        # from this workflow, so an unpinned release retroactively changes what
        # ships -- the same failure mode that took ruff, nanobind and GitPython
        # out. It had already happened here quietly: the 3.x -> 4.x major landed
        # unnoticed, and the wheels for 5.10.2 were built by a version nobody
        # chose. Bump deliberately, and re-read the arch note below when you do.
        run: pip install cibuildwheel==4.2.0

      - name: Build and test a repaired wheel (discarded)
        # Relative path, matching build-wheels below: an absolute /tmp is not a
        # path on the Windows runner. Nothing uploads this directory, so the
        # wheels go nowhere.
        run: cibuildwheel --output-dir validate-wheelhouse
        env:
          CIBW_ARCHS: "auto64"
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_TEST_REQUIRES: pytest numpy scipy
          CIBW_TEST_COMMAND: pytest {project}/tests -v

  # Automated versioning — push to main only. semantic-release analyzes
  # conventional commits since the last tag and, if a release is warranted,
  # bumps the version, updates the changelog, commits, tags, pushes, and creates
  # the GitHub Release. Outputs whether it released and the new tag.
  #
  # Gated on validate-wheels so the tag is never created ahead of a wheel that
  # cannot be built or cannot pass its own tests (#81). If validation fails,
  # this is skipped, `released` is never set, and the build/publish jobs below
  # short-circuit on that — nothing is tagged and nothing is published.
  #
  # Versioning policy: mtl5-python follows MTL5's major.minor; semantic-release
  # manages only PATCH (feat/fix/perf/refactor → patch). Major/minor bumps are
  # manual: edit pyproject.toml, commit, then semantic-release resumes.
  release:
    needs: [validate-wheels]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the release commit + tag, create the GitHub Release
    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for commit analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        # Pinned to the v10 line the pyproject [tool.semantic_release] config was
        # verified against; a major bump could change parser/changelog behavior.
        #
        # GitPython is pinned too, and it is not belt-and-braces. It is a
        # TRANSITIVE dependency of semantic-release, so pinning semantic-release
        # alone left it free to float -- and 3.1.60 removed Actor.name_email_regex,
        # which semantic-release still uses. The release job then died with
        #
        #   type object 'Actor' has no attribute 'name_email_regex'
        #
        # on a push that changed no release machinery whatsoever. Present through
        # 3.1.59, gone in 3.1.60; verified by running `semantic-release version
        # --print` against this repo under both.
        #
        # It failed safely -- `released` was never set, so the build/publish jobs
        # below short-circuited and nothing was tagged or pushed to PyPI -- but
        # "safely" here means "no releases at all until this is pinned".
        #
        # This is the third dependency to break the pipeline this way (ruff in
        # ci.yml, nanobind in pyproject.toml, now GitPython). The pattern worth
        # remembering: pinning the direct dependency does nothing for the
        # transitive one that actually breaks.
        run: pip install "python-semantic-release>=10,<11" "GitPython<3.1.60"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (bump, changelog, commit, tag, push, GitHub Release)
        id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # semantic-release commits, tags, pushes, and creates the GitHub
          # Release itself (v10 default). It creates a tag iff it releases, so
          # detect a release by tag-count growth. The GITHUB_TOKEN-created
          # Release does not cascade — this run's own build/publish jobs handle
          # the upload, so there is no double publish.
          before=$(git tag | wc -l)
          semantic-release version
          after=$(git tag | wc -l)
          if [ "$after" -gt "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
            echo "Released $(git describe --tags --abbrev=0)"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No conventional commits warranted a release."
          fi

  build-wheels:
    needs: [release]
    # Build on a human release or a dispatch; on push, only when the release job
    # actually cut a release. !cancelled() lets this run even though `release` is
    # skipped for release/dispatch events.
    if: >-
      !cancelled()
      && needs.release.result != 'failure'
      && (github.event_name != 'push' || needs.release.outputs.released == 'true')
    strategy:
      # One leg failing must not cancel the others: publish-pypi requires the
      # whole matrix to succeed anyway, and a cancelled leg hides whether the
      # failure was platform-specific.
      fail-fast: false
      matrix:
        # ubuntu-22.04-arm is a NATIVE arm64 runner (free for public repos), not
        # QEMU. It is here so Linux aarch64 -- Jetson, Graviton, Ampere, Pi --
        # gets a real wheel instead of falling back to the sdist and compiling
        # MTL5 + Universal + Highway + 14 nanobind TUs on the target, which is
        # slow on a small board and can OOM at default build parallelism.
        #
        # Measured on this runner: 4m13s for cp310/311/312 plus the full test
        # suite (1008 tests each), against 5m53s for the x86_64 leg. Emulated
        # aarch64 via docker/setup-qemu-action was rejected only because native
        # is free here -- QEMU's usual 5-20x penalty would put the leg in the
        # tens of minutes, wasteful but nowhere near the 6h job limit. So
        # emulation stays a viable option for an arch with no native runner.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # On push, build the tag semantic-release just created (bumped
          # version). On release/dispatch the release job is skipped, so
          # `tag` is empty and we fall back to the triggering ref.
          ref: ${{ needs.release.outputs.tag || github.ref }}
          persist-credentials: false  # build only reads; no token needed on disk

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        # Pinned. cibuildwheel builds, repairs and TESTS every wheel published
        # from this workflow, so an unpinned release retroactively changes what
        # ships -- the same failure mode that took ruff, nanobind and GitPython
        # out. It had already happened here quietly: the 3.x -> 4.x major landed
        # unnoticed, and the wheels for 5.10.2 were built by a version nobody
        # chose. Bump deliberately, and re-read the arch note below when you do.
        run: pip install cibuildwheel==4.2.0

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # 64-bit only. cibuildwheel's default "auto" archs still include the
          # 32-bit win32 target on Windows, and this C++20 / nanobind / Highway
          # extension has no 32-bit toolchain or deps, so that target fails the
          # build (observed: cp310-win32 exit code 1). auto64 selects just the
          # native 64-bit arch per runner: AMD64 on Windows, arm64 on macos-14,
          # and on Linux whatever the runner itself is -- x86_64 on ubuntu-22.04,
          # aarch64 on ubuntu-22.04-arm. That is why the arm64 wheel needs no
          # CIBW_ARCHS_LINUX override: the runner, not the arch list, selects it.
          # (Linux i686 was dropped from "auto" in cibuildwheel 3.0, so it is not
          # a factor at the pinned 4.2.0 either.)
          CIBW_ARCHS: "auto64"
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_TEST_REQUIRES: pytest numpy scipy
          CIBW_TEST_COMMAND: pytest {project}/tests -v

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    needs: [release]
    if: >-
      !cancelled()
      && needs.release.result != 'failure'
      && (github.event_name != 'push' || needs.release.outputs.released == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned for the same reason as cibuildwheel above: this builds the sdist
      # that is published alongside the wheels.
      - run: pip install build==1.6.0
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish to PyPI: on a human-cut Release, or on a push that cut a release.
  # OIDC `workflow` claim is wheels.yml (direct) — no token, uses the existing
  # trusted publisher (workflow=wheels.yml, environment=pypi). No skip-existing:
  # a duplicate production version must fail loudly, never be silently skipped.
  publish-pypi:
    needs: [release, build-wheels, build-sdist]
    if: >-
      !cancelled()
      && needs.build-wheels.result == 'success'
      && needs.build-sdist.result == 'success'
      && (github.event_name == 'release'
          || (github.event_name == 'push' && needs.release.outputs.released == 'true'))
    runs-on: ubuntu-latest
    environment: pypi  # optional manual-approval gate; configure in repo settings
    permissions:
      id-token: write  # mint the OIDC token PyPI verifies; no password needed
    steps:
      # download-artifact v8 errors on a digest mismatch rather than warning
      # (v7 and earlier only logged). That default is left alone deliberately:
      # the next step uploads these exact files to PyPI, where a corrupted
      # artifact is unfixable after the fact -- PyPI does not allow re-uploading
      # a version. Failing here is the cheap outcome.
      - name: Gather wheels and sdist into dist/
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true  # flatten wheels-*/ and sdist/ into a single dir

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Dry-run lane: publish to TestPyPI on a manual workflow_dispatch. Uses the
  # TestPyPI trusted publisher (its own per-index registration). skip-existing
  # lets a re-run at an unchanged version succeed instead of 400-ing.
  publish-testpypi:
    needs: [build-wheels, build-sdist]
    if: >-
      !cancelled()
      && needs.build-wheels.result == 'success'
      && needs.build-sdist.result == 'success'
      && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Gather wheels and sdist into dist/
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
