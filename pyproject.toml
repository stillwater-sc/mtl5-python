[build-system]
# Extra build requirements exist for stub generation (nanobind_add_stub imports
# the freshly built _core at build time):
#   - numpy: the ndarray signatures are annotated with numpy.typing.NDArray,
#     which must resolve when the stub is generated.
#   - typing_extensions on Python < 3.11: nanobind's stubgen.py imports it there
#     (src/stubgen.py) and nanobind does not declare it as a dependency, so we
#     require it explicitly rather than relying on it arriving transitively.
#   - packaging: scikit-build-core's vendored pyproject_metadata calls
#     canonicalize_name(..., validate=True) and catches packaging.utils.
#     InvalidName, both of which landed in packaging 22.0. Debian/Ubuntu's
#     patched site.py keeps /usr/lib/python3/dist-packages on sys.path INSIDE
#     pip's isolated build env, so a system python3-packaging (21.3 on Ubuntu
#     22.04) shadows whatever the overlay resolved and metadata generation dies
#     with "canonicalize_name() got an unexpected keyword argument 'validate'"
#     before CMake ever runs. Naming it here forces a modern packaging into the
#     overlay, which precedes dist-packages on sys.path and wins. Observed on a
#     Jetson (Ubuntu 22.04, system pip 22.0.2) installing the sdist.
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0",
    "numpy>=1.24",
    "packaging>=22",
    "typing_extensions>=4.0; python_version < '3.11'",
]
build-backend = "scikit_build_core.build"

[project]
name = "mtl5"
version = "5.9.1"
description = "Python bindings for MTL5 — NumPy/SciPy/JAX/PyTorch interop with hardware accelerator dispatch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
scipy = ["scipy>=1.10"]
torch = ["torch>=2.0"]
jax = ["jax[cpu]>=0.4"]
pandas = ["pandas>=2.0"]
sklearn = ["scikit-learn>=1.3"]
notebooks = ["matplotlib>=3.7", "jupyterlab>=4.0", "scipy>=1.10"]
all = ["scipy>=1.10", "torch>=2.0", "jax[cpu]>=0.4", "pandas>=2.0", "scikit-learn>=1.3"]
dev = ["pytest>=7.0", "numpy>=1.24", "scipy>=1.10"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DMTL5_ENABLE_PYTHON=ON"]

[tool.scikit-build.cmake.define]
MTL5_ENABLE_PYTHON = "ON"

# Route mtl::mult through MTL5's blocked GEMM / SIMD GEMV, vectorised by
# Google Highway. These two belong together: the blocked kernel is ~3.4x SLOWER
# than the generic one without Highway to vectorise it, and ~5.5-6.8x faster
# with it. Highway uses static dispatch at the x86-64 baseline here, so the
# wheel stays portable. Full measurements in the top-level CMakeLists.txt.
MTL5_NATIVE_FAST_GEMM = "ON"
MTL5_WITH_HIGHWAY = "ON"

# Opt-in acceleration. Each needs something extra on the build machine, so the
# defaults stay off for a portable wheel; enable at install time:
#   pip install . -C cmake.define.MTL5_WITH_BLAS=ON
#   pip install . -C cmake.define.MTL5_WITH_LAPACK=ON
#   pip install . -C cmake.define.MTL5_NATIVE_ARCH=ON   # local builds only
# MTL5_WITH_LAPACK additionally unlocks the geev/syev/gesdd dispatch paths that
# the eigen and SVD bindings will need (Phase 3). MTL5_NATIVE_ARCH lets Highway
# target AVX2/AVX-512 instead of the baseline, at the cost of portability.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# ---------------------------------------------------------------------------
# python-semantic-release configuration
#
# mtl5-python follows MTL5's major.minor version. Semantic-release manages
# only the PATCH component based on conventional commit messages:
#   feat: → patch bump (NOT minor — minor tracks MTL5 upstream)
#   fix:  → patch bump
#   breaking change → manual intervention (must align with MTL5 major bump)
#
# When MTL5 upstream releases a new major.minor (e.g. 5.3.0), manually set
# the version in pyproject.toml to match, then let semantic-release resume
# patch management from there.
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
major_on_zero = false
branch = "main"

[tool.semantic_release.commit_parser_options]
# Override: treat feat as patch (not minor) since minor tracks MTL5 upstream.
# Only an explicit "BREAKING CHANGE" footer triggers a minor bump here — but
# in practice, minor/major bumps are manual to align with MTL5.
#
# These are minor_TAGS / patch_TAGS. The conventional parser's options are
# named that way; it was configured as minor_types / patch_types, which the
# parser does not read, so the override was silently ignored and the defaults
# ('feat',) / ('fix', 'perf') applied -- the opposite of the intent above.
# Verified against python-semantic-release 10.6.1: constructing the options
# with the _types spellings leaves minor_tags at ('feat',).
minor_tags = []
patch_tags = ["feat", "fix", "perf", "refactor"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
# "update" inserts each generated release section at the insertion flag rather
# than regenerating the file, which is what keeps the hand-written Unreleased
# section in CHANGELOG.md. It is already the default -- stated explicitly
# because the file depends on it. (The alternative, "init", overwrites the
# changelog wholesale.)
#
# insertion_flag is the setting that actually has to be here: its default is
# empty, so the marker in CHANGELOG.md would not be found without it.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.publish]
upload_to_pypi = false
